general {
    lock_cmd = loginctl lock-session
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # 2 = release the systemd sleep inhibitor right after before_sleep_cmd is
    # spawned. Mode 3 waits for the compositor's lock notification, which this
    # setup never sends, so every suspend hit logind's 5 s inhibitor timeout.
    inhibit_sleep = 2
}

# No DPMS blanking: NVIDIA + high-refresh monitors often flap on/off with it.
# Suspend after 30 minutes of idle.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
