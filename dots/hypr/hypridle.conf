general {
    # loginctl lock-session (suspend, session menu) -> logind Lock -> Quickshell's
    # lock screen. The path must match autostart.lua's `qs -p`, ipc finds the
    # instance by config path.
    lock_cmd = qs -p "$HOME/dotfiles/dots/quickshell/ii" ipc call lock activate
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # 3 = hold the sleep inhibitor until Hyprland reports the session locked
    # (Quickshell's ext-session-lock), so the lock screen is up before suspend
    # and nothing of the desktop shows on resume. Before lock_cmd started
    # Quickshell's lock this never arrived and suspend waited logind's 5 s timeout.
    inhibit_sleep = 3
}

# No DPMS blanking: NVIDIA + high-refresh monitors often flap on/off with it.
# Suspend after 30 minutes of idle.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
